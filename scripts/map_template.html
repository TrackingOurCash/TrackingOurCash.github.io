<title>Riding Spending Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* Layout: one wide national map, a strip of city insets under it, a detail panel at the side; party colour is the base, spending is the saturation. */
:root {
  color-scheme: light;
  --page: #f6f6f3; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --water: #e4ecf1; --nodata: #d9d8d2;
  --sel: #0b0b0b; --focus: #2a78d6; --before: #c3c2b7; --after: #52514e;
  --land: #eceae2; --otherland: #e6e4dc; --p-IND: #6f6e69;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f0f0e; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --water: #141a1f; --nodata: #2f2f2d;
    --sel: #f0efec; --focus: #3987e5; --before: #5c5b57; --after: #c3c2b7;
    --land: #262624; --otherland: #1f1f1e; --p-IND: #9a9892;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f0f0e; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --water: #141a1f; --nodata: #2f2f2d;
  --sel: #f0efec; --focus: #3987e5; --before: #5c5b57; --after: #c3c2b7;
  --land: #262624; --otherland: #1f1f1e; --p-IND: #9a9892;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 16px; margin: 0 0 8px; text-wrap: balance; }
h3 { font-size: 13px; margin: 0 0 2px; }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sub { color: var(--ink-2); margin: 0 0 16px; max-width: 900px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 6px 10px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
select, input[type=search] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; max-width: 100%; }
label.chk { color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
@media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
.mapcard { padding: 10px; }
#svg { width: 100%; height: auto; display: block; touch-action: none; background: var(--water); border-radius: 8px; }
.r { stroke: var(--surface); stroke-width: 0.5; vector-effect: non-scaling-stroke; cursor: pointer; }
.land { fill: var(--land); stroke: none; pointer-events: none; }
.otherland { fill: var(--otherland); stroke: none; pointer-events: none; }
.lake { fill: var(--water); stroke: none; pointer-events: none; }
.coast { fill: none; stroke: var(--axis); stroke-width: 0.4; vector-effect: non-scaling-stroke; pointer-events: none; }
.river { fill: none; stroke: var(--water); stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.muni { fill: none; stroke: var(--ink); stroke-opacity: 0.55; stroke-width: 0.9; stroke-dasharray: 3 2; pointer-events: none; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.nav a { font-size: 13px; color: var(--ink-2); text-decoration: none; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
#theme { font: inherit; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
ul.grants a { color: inherit; text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
ul.grants a:hover { text-decoration-color: var(--ink); }
.r:hover { stroke: var(--sel); stroke-width: 1.6; }
.r.sel { stroke: var(--sel); stroke-width: 2.4; }
.r:focus, .r:focus-visible { outline: none; }  /* the browser's box-shaped focus ring; the bold outline above marks the selection */
.bdot { fill-opacity: 0.8; stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
.bdot.citywide { fill-opacity: 0.4; }
ul.budget { list-style: none; padding: 0; margin: 6px 0 0; }
ul.budget li { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 12px; }
.sw-big { display: inline-block; vertical-align: middle; border-radius: 3px; border: 1px solid var(--border); }
.insets { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 8px; }
.inset { background: var(--water); border-radius: 8px; padding: 4px; }
.inset svg { width: 100%; height: auto; display: block; }
.inset .cap { font-size: 11px; color: var(--ink-2); padding: 2px 4px 0; display: flex; justify-content: space-between; }
.inset .cap button { font: inherit; font-size: 11px; border: 0; background: none; color: var(--focus); cursor: pointer; padding: 0; }
.zoombar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.zoombar button { font: inherit; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; color: var(--ink-2); font-size: 12px; margin-top: 10px; }
.legend .lab { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
.ramp { display: flex; gap: 1px; }
.ramp span { width: 14px; height: 12px; display: block; }
.ramp span:first-child { border-radius: 2px 0 0 2px; } .ramp span:last-child { border-radius: 0 2px 2px 0; }
.swl { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; max-width: 270px; z-index: 10; }
#tip b { font-size: 13px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; color: #fff; border-radius: 999px; padding: 1px 7px; vertical-align: 1px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.big { font: 600 22px/1.1 "Source Serif 4", Georgia, serif; margin: 2px 0 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.result { border-left: 3px solid var(--axis); padding: 4px 10px; margin: 10px 0; }
ul.grants { list-style: none; padding: 0; margin: 6px 0 0; }
ul.grants li { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 12px; }
ul.grants li b { font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--axis); border-radius: 4px; padding: 0 4px; color: var(--ink-2); }
.pies { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.pie { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: center; }
.pie svg { width: 170px; height: 170px; display: block; }
.pie .leg { font-size: 12px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 2px 8px; align-items: center; }
.pie .leg .h { color: var(--muted); font-size: 11px; }
.pcbars { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(90px, auto) 1fr 70px; gap: 3px 8px; align-items: center; font-size: 12px; margin-top: 6px; }
.pcbars .bar { height: 10px; border-radius: 0 3px 3px 0; min-width: 1px; }
.pcbars .v { text-align: right; font-variant-numeric: tabular-nums; }
.pcbars .avg { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
.pie .leg .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.pie h3 { grid-column: 1 / -1; margin: 0; }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.bar { height: 12px; border-radius: 0 4px 4px 0; margin: 2px 0; }
.barrow { display: grid; grid-template-columns: 52px 1fr 64px; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); }
.barrow .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.tablewrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--grid); }
tbody tr.sel { background: var(--grid); box-shadow: inset 3px 0 0 var(--focus); font-weight: 600; }
tbody tr.sel td { border-bottom-color: var(--focus); }
.notes { color: var(--ink-2); font-size: 13px; }
.notes li { margin-bottom: 4px; }
.notes a, #panel a { color: var(--focus); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="topbar"><h1 id="title"></h1><button id="theme" type="button" aria-pressed="false">Dark mode</button></div>
  <nav class="nav" id="nav" aria-label="Maps"></nav>
  <p class="sub" id="subtitle"></p>

  <div class="controls">
    <div class="seg" role="group" aria-label="What sets the colour depth" id="metric">
      <button data-m="pc" aria-pressed="true">Depth = $ per person</button>
      <button data-m="chg">Depth = change vs year before</button>
    </div>
    <select id="dept" aria-label="Program or department"><option value="" id="deptAll"></option></select>
    <label class="chk"><input type="checkbox" id="natl"> <span id="natlLabel"></span></label>
    <label class="chk"><input type="checkbox" id="closeOnly"> Close ridings only</label>
    <label class="chk" id="budgetLabel" hidden><input type="checkbox" id="budgetDots" checked> Budget commitments (dots)</label>
    <select id="budgetScope" aria-label="Which budgets" hidden></select>
  </div>

  <div class="grid">
    <div class="card mapcard">
      <svg id="svg" viewBox="0 0 960 600" role="img" aria-label="Map"><defs id="defs"></defs><g id="main"></g></svg>
      <div class="zoombar" id="zoombar"><span class="small muted">Scroll or pinch to zoom, drag to pan.</span></div>
      <div class="insets" id="insets"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card" id="panel"><p class="muted">Hover a riding for a summary. Click it for the MP, the 2025 result and its largest grants.</p></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>Who gets it</h2>
    <p class="small muted" id="pieNote"></p>
    <div class="pies" id="pies"></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2 id="groupTitle">Does money follow close seats?</h2>
    <p class="small muted" id="groupNote"></p>
    <div class="groups" id="groups"></div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="controls" style="justify-content:space-between">
      <h2 style="margin:0" id="tableTitle">All ridings</h2>
      <input type="search" id="q" placeholder="Search" aria-label="Search">
    </div>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="card notes" style="margin-top:16px" id="notes"></div>
</div>
<div id="tip"></div>

<script>
const D = /*__DATA__*/null;
const R = D.ridings, M = D.meta, C = D.config, YEARS = M.years_per_window;
const PARTY = Object.fromEntries(Object.entries(C.parties).map(([k, p]) => [k, p.name]));
PARTY[""] = "Vacant"; PARTY.IND = PARTY.IND || "Independent"; PARTY.OTH = "Other";
const PVAR = new Proxy({}, {get: (_, k) => C.parties[k] ? `--p-${k}` : "--p-IND"});
const FLAG = C.flags;
function applyPartyColors() {
  const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  for (const [k, p] of Object.entries(C.parties)) document.documentElement.style.setProperty(`--p-${k}`, dark ? p.dark : p.light);
}
applyPartyColors();
document.getElementById("title").textContent = C.title;
document.title = C.title;
document.getElementById("nav").innerHTML = C.nav.map(n => `<a href="${n.href}"${n.current ? ' aria-current="page"' : ""}>${n.label}</a>`).join("");
document.getElementById("deptAll").textContent = C.filterAll;
document.getElementById("natlLabel").textContent = C.includeLabel;
document.getElementById("groupTitle").textContent = C.groupTitle;
document.getElementById("tableTitle").textContent = `All ${C.levelPlural}`;
document.getElementById("q").placeholder = `Search ${C.level}, ${C.rep} or ${C.region}`;
const fmt$ = v => v == null ? "–" : "$" + (Math.abs(v) >= 1e9 ? (v/1e9).toFixed(2) + "B" : Math.abs(v) >= 1e6 ? (v/1e6).toFixed(1) + "M" : Math.abs(v) >= 1e3 ? (v/1e3).toFixed(0) + "K" : Math.round(v));
const fmtPc = v => v == null ? "–" : "$" + (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2));
const fmtPct = v => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(0) + "%";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const state = {metric: "pc", dept: "", natl: false, closeOnly: false, budget: true, budgetScope: "all", sel: null, sort: "pc", dir: -1, q: ""};
const BUDGET = D.budget || null;
// Budget documents are listed oldest first; "latest" is the most recent one.
const LATEST_BUDGET = BUDGET ? BUDGET.documents.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0] : null;
const budgetItems = n => (BUDGET.by_riding[n] || []).filter(i => state.budgetScope === "all" || LATEST_BUDGET.name.startsWith(i.budget));
function newsLine(t) {
  if (!("news" in t) || !t.news || t.news.searched === false) return "";
  const n = t.news;
  const part = (label, a) => a ? `${label}: <a href="${a.url}" target="_blank" rel="noopener" title="${(a.title || "").replace(/"/g, "&quot;")}">${a.outlet || new URL(a.url).hostname.replace(/^www\./, "")}</a>` : `${label}: <span class="muted">none found</span>`;
  return `<br><span class="small">${part("Mainstream", n.mainstream)} · ${part("Independent", n.independent)}</span>`;
}
const recordUrl = t => C.recordUrl ? C.recordUrl.replace("{org}", encodeURIComponent(t.org)).replace("{ref}", encodeURIComponent(t.ref)) : null;
const searchUrl = who => C.searchUrl ? C.searchUrl.replace("{q}", encodeURIComponent('"' + who + '"')) : null;
const pill = p => `<span class="pill" style="background:var(${PVAR[p] || "--ind"})">${PARTY[p] || p}</span>`;

// ---- metric computation ----
function compute() {
  const out = {};
  for (const [n, r] of Object.entries(R)) {
    let after, before;
    if (state.dept) {
      after = (D.dept[state.dept] || {})[n] || 0;
      before = (D.deptBefore[state.dept] || {})[n] || 0;
    } else if (state.natl) { after = r.after_total; before = r.before_total; }
    else { after = r.after_adj; before = r.before_adj; }
    const pc = after / r.population / YEARS, pcb = before / r.population / YEARS;
    out[n] = {after, before, pc, pcb, chg: before > 0 ? 100 * (after - before) / before : (after > 0 ? null : null)};
  }
  // Colour depth is the riding's rank on the chosen measure, 0 (lightest) to 1 (full party colour).
  const key = state.metric === "pc" ? "pc" : "chg";
  const ranked = Object.keys(R).filter(n => out[n][key] != null && (key !== "pc" || out[n].pc > 0)).sort((a, b) => out[a][key] - out[b][key]);
  ranked.forEach((n, i) => out[n].t = ranked.length > 1 ? i / (ranked.length - 1) : 0.5);
  for (const n of Object.keys(R)) if (out[n].t == null) out[n].t = key === "pc" ? 0 : null;
  const med = d3.median(Object.values(out), d => d.pc) || 0;
  for (const v of Object.values(out)) v.score = med > 0 ? v.pc / med : null;
  return out;
}

// ---- colour: party hue, spending depth ----
let surfaceColor = css("--surface");
function tint(party, t) {
  const base = css(PVAR[party] || "--ind");
  return d3.interpolateLab(surfaceColor, base)(0.18 + 0.82 * t);
}
const defs = d3.select("#defs").append("g").attr("id", "patdefs");
const patterns = new Set();
function hatch(pa, pb, t) {
  const b = Math.round(t * 7);
  const id = `h-${pa}-${pb}-${b}`;
  if (!patterns.has(id)) {
    patterns.add(id);
    const p = defs.append("pattern").attr("id", id).attr("patternUnits", "userSpaceOnUse").attr("width", 5).attr("height", 5).attr("patternTransform", `rotate(45) scale(${1 / zoomK})`);
    p.append("rect").attr("width", 5).attr("height", 5).attr("fill", tint(pa, b / 7));
    p.append("rect").attr("width", 2.5).attr("height", 5).attr("fill", tint(pb, b / 7));
  }
  return `url(#${id})`;
}
function fillFor(n, v) {
  const r = R[n];
  if (state.closeOnly && !r.close) return css("--nodata");
  const t = v.t == null ? 0.18 : v.t;
  const party = r.rep_party || r.party_won;
  if (r.close) return hatch(r.party_won, r.runnerup_party, t);
  return tint(party, t);
}

// ---- main map ----
const W = 960, H = 600;
const svg = d3.select("#svg");
const proj = d3.geoConicConformal().parallels(C.projection.parallels).rotate(C.projection.rotate).fitExtent([[6, 6], [W - 6, H - 6]], D.geo);
const path = d3.geoPath(proj);
const g = d3.select("#main");
const LAND = D.land.features;
const byKind = k => LAND.filter(f => f.properties.kind === k);
function drawLand(parent, pth, clipId, box) {
  // box: an inset's [west, south, east, north]; insets also get small lakes, rivers and municipal outlines.
  // The national map clips ridings to the coastline.
  const near = f => { if (!box) return false; const [[x0, y0], [x1, y1]] = d3.geoBounds(f); return x1 > box[0] && x0 < box[2] && y1 > box[1] && y0 < box[3]; };
  parent.selectAll(".otherland").data(byKind("other")).join("path").attr("class", "otherland").attr("d", pth);
  parent.selectAll(".land").data(byKind("canada")).join("path").attr("class", "land").attr("d", pth);
  // Insets clip to the municipal boundaries instead, which follow the shoreline closely
  // (census subdivisions stop at the water's edge); the coastline file is too coarse there.
  const munis = box ? byKind("muni").filter(near) : [];
  const clipShapes = munis.length ? munis : byKind("canada");
  d3.select("#defs").insert("clipPath", "#patdefs").attr("id", clipId).selectAll("path").data(clipShapes).join("path").attr("d", pth);
  const layer = parent.append("g").attr("clip-path", `url(#${clipId})`);
  const over = parent.append("g");
  over.selectAll(".lake").data(byKind("lake").concat(box ? byKind("lake_small").filter(near) : [])).join("path").attr("class", "lake").attr("d", pth);
  if (box) {
    over.selectAll(".river").data(byKind("river").filter(near)).join("path").attr("class", "river").attr("d", pth);
    over.selectAll(".muni").data(byKind("muni").filter(near)).join("path").attr("class", "muni").attr("d", pth).append("title").text(d => d.properties.name);
  }
  if (!box) over.selectAll(".coast").data(byKind("canada")).join("path").attr("class", "coast").attr("d", pth);
  return layer;
}
const ridingLayer = drawLand(g, path, "clip-canada");
const paths = ridingLayer.selectAll("path").data(D.geo.features).join("path")
  .attr("class", "r").attr("d", path).attr("tabindex", 0).attr("aria-label", d => R[d.id].name)
  .on("mousemove", (e, d) => showTip(e, d.id)).on("mouseleave", hideTip)
  .on("click", (e, d) => select(d.id)).on("keydown", (e, d) => { if (e.key === "Enter") select(d.id); });
// Budget commitments: one dot per riding named in a budget document, sized by the dollars named.
const dotLayer = g.append("g").attr("class", "dots");
function renderDots() {
  if (!BUDGET) return;
  const rows = state.budget ? Object.keys(BUDGET.by_riding).map(n => [n, budgetItems(n)]).filter(d => d[1].length) : [];
  const feat = Object.fromEntries(D.geo.features.map(f => [f.id, f]));
  // Dots keep a fixed size on screen (3 to 9 px) whatever the zoom, so they never cover a riding.
  // National programs that merely name a first project don't count toward the dot's size.
  const ink = css("--ink"), surface = css("--surface");
  dotLayer.selectAll("circle").data(rows, d => d[0]).join("circle")
    .attr("class", d => "bdot" + (d[1].every(i => i.city_wide) ? " citywide" : ""))
    .attr("fill", ink).attr("stroke", surface)
    .attr("transform", d => `translate(${path.centroid(feat[d[0]])})`)
    .attr("data-r", d => Math.min(9, 3 + Math.sqrt(d3.sum(d[1], i => /^national|^program/.test(i.kind) ? 0 : (i.amount_millions || 0))) / 8))
    .attr("r", function () { return +this.dataset.r / zoomK; });
}
let zoomK = 1;
const zoom = d3.zoom().scaleExtent([1, 80]).on("zoom", e => {
  g.attr("transform", e.transform);
  // Keep the close-seat stripes the same width on screen whatever the zoom.
  if (Math.abs(e.transform.k - zoomK) / zoomK > 0.15) { zoomK = e.transform.k; defs.selectAll("pattern").attr("patternTransform", `rotate(45) scale(${1 / zoomK})`); }
  dotLayer.selectAll("circle").attr("r", function () { return +this.dataset.r / e.transform.k; });
});
svg.call(zoom);
function zoomTo(b, factor = 1) {
  // factor 0.5 fits the box into half the map, so the surrounding area shows too.
  if (!b) return svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
  const [x0, y0] = proj([b[0], b[3]]), [x1, y1] = proj([b[2], b[1]]);
  const k = Math.min(80, 0.9 * factor / Math.max((x1 - x0) / W, (y1 - y0) / H));
  svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
}
d3.select("#zoombar").append("button").text("Reset view").on("click", () => zoomTo(null));

// ---- city insets (Elections Canada style) ----
const INSETS = C.insets;
const insetPaths = [];
const insetsEl = d3.select("#insets");
const FINE = Object.fromEntries((D.geoFine.features || []).map(f => [f.id, f]));
for (const [name, b] of INSETS) {
  const feats = D.geo.features.map(f => FINE[f.id] || f).filter(f => { const [[x0, y0], [x1, y1]] = d3.geoBounds(f); return x1 > b[0] && x0 < b[2] && y1 > b[1] && y0 < b[3]; });
  const w = 190, h = Math.round(w * (b[3] - b[1]) / ((b[2] - b[0]) * Math.cos((b[1] + b[3]) / 2 * Math.PI / 180)));
  const ip = d3.geoMercator().fitExtent([[0, 0], [w, h]], {type: "Polygon", coordinates: [[[b[0], b[1]], [b[0], b[3]], [b[2], b[3]], [b[2], b[1]], [b[0], b[1]]]]});
  const box = insetsEl.append("div").attr("class", "inset");
  const s = box.append("svg").attr("viewBox", `0 0 ${w} ${h}`);
  const cid = "clip-" + name.replace(/\W/g, "");
  s.append("clipPath").attr("id", cid).append("rect").attr("width", w).attr("height", h);
  const inner = s.append("g").attr("clip-path", `url(#${cid})`);
  const ipath = d3.geoPath(ip);
  const ps = drawLand(inner, ipath, cid + "-land", b).selectAll("path").data(feats).join("path")
    .attr("class", "r").attr("d", d3.geoPath(ip))
    .on("mousemove", (e, d) => showTip(e, d.id)).on("mouseleave", hideTip).on("click", (e, d) => { select(d.id); zoomTo(b, 0.5); });
  insetPaths.push(ps);
  const cap = box.append("div").attr("class", "cap");
  cap.append("span").text(name);
  cap.append("button").text("zoom main map").on("click", () => zoomTo(b, 0.5));
}

  hb.append("div").html(`<svg width="60" height="14" aria-hidden="true"><rect width="60" height="14" rx="2" fill="${hatch(C.legendParties[0], C.legendParties[1], 0.7)}"></rect></svg>`);

// ---- tooltip & panel ----
const tip = document.getElementById("tip");
function showTip(e, n) {
  const r = R[n], v = V[n];

    ${C.electionYear}: ${PARTY[r.party_won]} by ${r.margin_votes.toLocaleString()} votes (${r.margin_pts} pts)${r.close ? " · <b>close</b>" : ""}<br>

function hideTip() { tip.style.display = "none"; }

const featById = Object.fromEntries(D.geo.features.map(f => [f.id, f]));
function zoomToRiding(n) {
  const [[w, s], [e, no]] = d3.geoBounds(featById[n]);

  document.getElementById("svg").scrollIntoView({block: "nearest", behavior: "smooth"});
}
function select(n, quiet) {

  document.getElementById("panel").innerHTML = `
    <h2 style="margin-bottom:2px">${r.name}</h2>
    <div class="small muted">${r.region} · pop. ${r.population.toLocaleString()} (${C.popLabel})${r.wiki ? ` · <a href="${r.wiki}" target="_blank" rel="noopener">Wikipedia</a>` : ""}${r.poliwave ? ` · <a href="${r.poliwave}" target="_blank" rel="noopener">Poliwave projection</a>` : ""}</div>
    <div class="small" style="margin-top:6px"><svg class="sw-big" width="44" height="18" aria-hidden="true"><rect width="44" height="18" fill="${fillFor(n, v)}"></rect></svg>
      <span class="muted">map colour: ${r.close ? "close seat, striped " + PARTY[r.party_won] + " / " + PARTY[r.runnerup_party] : PARTY[r.rep_party || r.party_won]}${rank ? `, ${rank === 1 ? "deepest" : "#" + rank} of ${rankOf.length} by ${state.metric === "pc" ? "$ per person" : "change vs before"}` : ""}</span></div>
    <p style="margin:10px 0 4px"><b>${r.rep}</b> ${pill(r.rep_party)}${switched ? ` <span class="tag">elected as ${PARTY[r.party_won]}</span>` : ""}</p>
    <div class="result" style="border-color:var(${PVAR[r.party_won]})">
      <div><b>${r.winner}</b> (${PARTY[r.party_won]}) won by <b>${r.margin_votes.toLocaleString()} votes</b> (${r.margin_pts} pts) over ${r.runnerup} (${PARTY[r.runnerup_party]})${r.close ? ' <span class="tag">close</span>' : ""}</div>
      <div class="small muted">${shares}</div>
    </div>
    <div class="small muted">Grants since the election (${M.election} to ${M.cutoff}, the last fully reported quarter)</div>

    <dl class="kv" style="margin-top:8px">
      <dt>Per person per year</dt><dd>${fmtPc(v.pc)}</dd>
      <dt>${C.beforeLabel}<br><span class="muted">(${M.before_start} to ${M.before_end})</span></dt><dd>${fmt$(v.before)} · ${fmtPc(v.pcb)}/person</dd>
      <dt>Change</dt><dd>${fmtPct(v.chg)}</dd>
      <dt>vs median riding</dt><dd>${v.score == null ? "–" : v.score.toFixed(2) + "×"}</dd>
      <dt>Awards, everything included</dt><dd>${r.after_n.toLocaleString()} · ${fmt$(r.after_total)}</dd>
    </dl>
    <h2 style="margin-top:14px">${C.topProgsTitle}</h2>
    <dl class="kv">${r.top_progs.map(([d, x]) => `<dt class="small">${d}</dt><dd>${fmt$(x)}</dd>`).join("") || "<dt>None</dt><dd></dd>"}</dl>
    <h2 style="margin-top:14px">${C.topGrantsTitle}</h2>
    <ul class="grants">${r.top_grants.map(t => `<li><b>${fmt$(t.v)}</b> ${t.org && recordUrl(t) ? `<a href="${recordUrl(t)}" target="_blank" rel="noopener">${t.who}</a>` : t.who}${t.n > 1 ? ` <span class="muted">(${t.n} payments)</span>` : ""}${t.flag ? ` <span class="tag">${FLAG[t.flag]}</span>` : ""}${t.how.includes("approx") ? ' <span class="tag">location approx.</span>' : ""}<br><span class="muted">${t.prog}${t.dept ? " · " + t.dept : ""} · ${t.date}${t.city ? " · " + t.city : ""}${searchUrl(t.who) ? ` · <a href="${searchUrl(t.who)}" target="_blank" rel="noopener">${C.searchLabel}</a>` : ""}</span>${newsLine(t)}</li>`).join("") || "<li class='muted'>None recorded</li>"}</ul>
    <p class="small muted">${C.linkNote}</p>
    ${BUDGET ? budgetSection(n) : ""}`;
  // Keep the reader at the map: the panel sits beside it on wide screens; on narrow ones bring the panel up.

}

// ---- budget commitments naming a riding ----
function budgetSection(n) {
  const items = budgetItems(n);
  const docsIn = state.budgetScope === "all" ? BUDGET.documents : [LATEST_BUDGET];
  const docs = docsIn.map(d => `<a href="${d.url}" target="_blank" rel="noopener">${d.name}</a>`).join(" or ");
  const scope = state.budgetScope === "all" ? `since the ${C.electionYear} election` : "in the latest budget document";
  if (!items.length) return `<h2 style="margin-top:14px">Budget commitments ${scope}</h2><p class="small muted">${docs} ${docsIn.length > 1 ? "do not name" : "does not name"} a place in this ${C.level}.</p>`;
  return `<h2 style="margin-top:14px">Budget commitments naming this ${C.level} ${scope}</h2>
    <ul class="budget">${items.map(i => `<li><b>${i.amount_millions == null ? "Amount not stated" : "$" + (i.amount_millions >= 1000 ? (i.amount_millions / 1000).toFixed(1) + "B" : i.amount_millions + "M")}</b>${i.years ? ` <span class="muted">· ${i.years}</span>` : ""}${i.city_wide ? ' <span class="tag">city-wide</span>' : ""} <span class="tag">${i.kind}</span><br>${i.text}<br><span class="muted">${i.department} · <a href="${i.url}" target="_blank" rel="noopener">${i.budget}, section</a></span></li>`).join("")}</ul>
    <p class="small muted">${BUDGET.next}</p>`;
}

// ---- pies: who gets it ----
const SEQ_BLUE = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"];
function pie(container, title, items, note) {
  // items: [{label, value, pop, color}], already in the order the slices should run clockwise from 12 o'clock.
  const total = d3.sum(items, d => d.value) || 1;
  const totalPop = d3.sum(items, d => d.pop) || 1;
  const avg = total / totalPop / YEARS;
  const box = container.append("div").attr("class", "pie");
  box.append("h3").text(title);
  const svgp = box.append("svg").attr("viewBox", "0 0 170 170").attr("role", "img").attr("aria-label", title);
  const arcs = d3.pie().sort(null).value(d => d.value)(items);
  const arc = d3.arc().innerRadius(38).outerRadius(82);
  const gg = svgp.append("g").attr("transform", "translate(85,85)");
  gg.selectAll("path").data(arcs).join("path").attr("d", arc).attr("fill", d => d.data.color).attr("stroke", css("--surface")).attr("stroke-width", 1.5)
    .append("title").text(d => `${d.data.label}: ${fmt$(d.data.value)} (${(100 * d.data.value / total).toFixed(1)}%)`);
  gg.selectAll("text").data(arcs.filter(d => d.endAngle - d.startAngle > 0.35)).join("text")
    .attr("transform", d => `translate(${arc.centroid(d)})`).attr("text-anchor", "middle").attr("dy", "0.35em")
    .attr("font-size", 10).attr("fill", "#fff").attr("font-weight", 600).text(d => d.data.short || d.data.label);
  const leg = box.append("div").attr("class", "leg");
  for (const t of ["", "", "share of $", "share of people"]) leg.append("span").attr("class", "h").text(t);
  for (const it of items) {
    leg.append("span").attr("class", "sw").style("background", it.color);
    leg.append("span").text(it.label);
    leg.append("span").attr("class", "n").text(`${fmt$(it.value)} · ${(100 * it.value / total).toFixed(0)}%`);
    leg.append("span").attr("class", "n").text(`${(100 * it.pop / totalPop).toFixed(0)}%`);
  }
  // Per resident: the fair comparison, since parties and provinces hold very different populations.
  const bars = box.append("div").attr("class", "pcbars");
  const maxPc = d3.max(items, it => it.value / (it.pop || 1) / YEARS) || 1;
  for (const it of items) {
    const pc = it.value / (it.pop || 1) / YEARS;
    bars.append("span").text(it.label);
    bars.append("div").attr("class", "bar").style("width", `${100 * pc / maxPc}%`).style("background", it.color);
    bars.append("span").attr("class", "v").text(fmtPc(pc));
  }
  bars.append("div").attr("class", "avg").text(`Per resident per year, population ${C.popLabel}. Average across all ${C.levelPlural}: ${fmtPc(avg)}.`);
  if (note) box.append("div").attr("class", "small muted").style("grid-column", "1 / -1").text(note);
}
function renderPies() {
  const el = d3.select("#pies").html("");
  const byParty = {}, popParty = {};
  for (const n of Object.keys(R)) { const p = R[n].rep_party || "IND"; byParty[p] = (byParty[p] || 0) + V[n].after; popParty[p] = (popParty[p] || 0) + R[n].population; }
  const partyItems = Object.entries(byParty).sort((a, b) => b[1] - a[1]).map(([p, v]) => ({label: PARTY[p] || p, short: p, value: v, pop: popParty[p], color: tint(p, 1)}));
  pie(el, `By the current ${C.rep}'s party`, partyItems, `Grants since the election, summed over the ${C.levelPlural} each party now holds. If money followed people evenly, each party's share of dollars would match its share of people and the per-resident bars would be level.`);
  if (C.regionOrder) {
    const byRegion = {}, popRegion = {};
    for (const n of Object.keys(R)) { const key = C.regionGroup[R[n].region] || R[n].region; byRegion[key] = (byRegion[key] || 0) + V[n].after; popRegion[key] = (popRegion[key] || 0) + R[n].population; }
    const items = C.regionOrder.filter(r => byRegion[r]).map((r, i) => ({label: r, short: C.regionShort[r] || r, value: byRegion[r], pop: popRegion[r], color: SEQ_BLUE[Math.round(i * (SEQ_BLUE.length - 1) / Math.max(1, C.regionOrder.length - 1))]}));
    pie(el, "By province", items, "Slices run clockwise from the North: Atlantic on the right, Quebec and Ontario at the bottom, the Prairies and BC on the left.");
  }
  document.getElementById("pieNote").textContent = `${state.dept || C.filterAll}${state.natl && !state.dept ? ", everything included" : ""}; the pies follow the filters above.`;
}

// ---- four-group comparison ----
function renderGroups() {
  const names = C.groups;
  const rows = names.map(gname => {
    const ns = Object.keys(R).filter(n => R[n].group === gname);
    const chg = ns.map(n => V[n].chg).filter(x => x != null);
    return {gname, count: ns.length, after: d3.median(ns, n => V[n].pc), before: d3.median(ns, n => V[n].pcb), chg: d3.median(chg), total: d3.sum(ns, n => V[n].after)};
  });
  const max = d3.max(rows, r => Math.max(r.after, r.before)) || 1;
  document.getElementById("groupNote").innerHTML = `Median ${C.level} in each group, ${state.dept || C.filterAll.toLowerCase()}${state.natl && !state.dept ? ", everything included" : ""}. ${C.groupNote} Lighter bar: ${C.beforeLabel.toLowerCase()}; full bar: since the election.`;
  document.getElementById("groups").innerHTML = rows.map(r => { const gp = C.groupParty[r.gname]; const cA = gp ? tint(gp, 1) : "var(--after)", cB = gp ? tint(gp, 0.35) : "var(--before)"; return `<div>
    <h3>${gp ? `<span class="sw" style="background:${cA}"></span>` : ""}${r.gname} <span class="muted small">· ${r.count} ${C.levelPlural}</span></h3>
    <div class="barrow"><span>Before</span><div class="bar" style="width:${100 * r.before / max}%;background:${cB}"></div><span class="v">${fmtPc(r.before)}</span></div>
    <div class="barrow"><span>After</span><div class="bar" style="width:${100 * r.after / max}%;background:${cA}"></div><span class="v">${fmtPc(r.after)}</span></div>
    <div class="small muted">per person per year · median change ${fmtPct(r.chg)} · total ${fmt$(r.total)}</div></div>`; }).join("");
}

// ---- table ----
const COLS = [
  ["name", C.levelTitle, r => r.name], ["prov", C.regionTitle, r => r.region],
  ["mp", `${C.rep} (current)`, r => `${r.rep} · ${r.rep_party || "–"}`], ["win", C.electionYear, r => r.party_won],
  ["margin", "Margin (votes)", r => r.margin_votes, true], ["mpts", "Margin (pts)", r => r.margin_pts, true],
  ["after", "$ since election", (r, v) => v.after, true], ["pc", "$/person/yr", (r, v) => v.pc, true],
  ["pcb", "Before", (r, v) => v.pcb, true], ["chg", "Change", (r, v) => v.chg, true],
];
function renderTable() {
  const thead = document.querySelector("#tbl thead"), tbody = document.querySelector("#tbl tbody");
  thead.innerHTML = "<tr>" + COLS.map(([k, label, , num]) => `<th data-k="${k}" class="${num ? "n" : ""}">${label}${state.sort === k ? (state.dir < 0 ? " ▼" : " ▲") : ""}</th>`).join("") + "</tr>";
  thead.querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; state.dir = state.sort === k ? -state.dir : -1; state.sort = k; renderTable(); });
  const col = COLS.find(c => c[0] === state.sort);
  const q = state.q.toLowerCase();
  const ns = Object.keys(R).filter(n => (!state.closeOnly || R[n].close) && (!q || (R[n].name + " " + R[n].rep + " " + R[n].region).toLowerCase().includes(q)));
  ns.sort((a, b) => { const x = col[2](R[a], V[a]), y = col[2](R[b], V[b]); if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * state.dir; });
  tbody.innerHTML = ns.map(n => { const r = R[n], v = V[n]; return `<tr data-n="${n}"><td><span class="sw" style="background:var(${PVAR[r.rep_party]})"></span>${r.name}${r.close ? ' <span class="tag">close</span>' : ""}</td><td>${r.region.slice(0, 16)}</td>
      <td>${r.rep} · ${r.rep_party || "–"}</td><td>${r.party_won}</td><td class="n">${r.margin_votes.toLocaleString()}</td><td class="n">${r.margin_pts}</td>
      <td class="n">${fmt$(v.after)}</td><td class="n">${fmtPc(v.pc)}</td><td class="n">${fmtPc(v.pcb)}</td><td class="n">${fmtPct(v.chg)}</td></tr>`; }).join("");
  tbody.querySelectorAll("tr").forEach(tr => {
    tr.classList.toggle("sel", tr.dataset.n === state.sel);
    // Clicking a row selects the riding and zooms the main map so the riding fills half the view.
    tr.onclick = () => { select(tr.dataset.n); zoomToRiding(tr.dataset.n); };
  });
}

// ---- controls ----
document.querySelectorAll("#metric button").forEach(b => b.onclick = () => { document.querySelectorAll("#metric button").forEach(x => x.setAttribute("aria-pressed", x === b)); state.metric = b.dataset.m; render(); });
const deptSel = document.getElementById("dept");
C.filterOptions.slice().sort((a, b) => a.localeCompare(b, "en", {sensitivity: "base"})).forEach(d => deptSel.add(new Option(d, d)));
deptSel.onchange = () => { state.dept = deptSel.value; document.getElementById("natl").disabled = !!state.dept; render(); };
document.getElementById("natl").onchange = e => { state.natl = e.target.checked; render(); };
document.getElementById("closeOnly").onchange = e => { state.closeOnly = e.target.checked; render(); };
if (BUDGET) {
  document.getElementById("budgetLabel").hidden = false;
  document.getElementById("budgetDots").onchange = e => { state.budget = e.target.checked; renderLegend(); renderDots(); };
  const scopeSel = document.getElementById("budgetScope");
  scopeSel.hidden = false;
  scopeSel.add(new Option(`All budgets since the ${C.electionYear} election (${BUDGET.documents.map(d => d.name.replace(/ \(.*\)/, "")).join(", ")})`, "all"));
  scopeSel.add(new Option(`Latest only: ${LATEST_BUDGET.name.replace(/ \(.*\)/, "")}`, "latest"));
  scopeSel.onchange = () => { state.budgetScope = scopeSel.value; renderLegend(); renderDots(); if (state.sel) select(state.sel, true); };
}
document.getElementById("q").oninput = e => { state.q = e.target.value; renderTable(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { applyPartyColors(); render(); });
const themeBtn = document.getElementById("theme");
const isDark = () => document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
function syncThemeBtn() { const d = isDark(); themeBtn.textContent = d ? "Light mode" : "Dark mode"; themeBtn.setAttribute("aria-pressed", d); }
themeBtn.onclick = () => { const next = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = next; try { localStorage.setItem("theme", next); } catch (e) {} syncThemeBtn(); applyPartyColors(); render(); };
try { const saved = localStorage.getItem("theme"); if (saved && !document.documentElement.dataset.theme) document.documentElement.dataset.theme = saved; } catch (e) {}
syncThemeBtn();
new MutationObserver(() => { syncThemeBtn(); applyPartyColors(); render(); }).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

document.getElementById("subtitle").textContent = C.subtitle;
document.getElementById("notes").innerHTML = `<h2>How to read this</h2><ul>${C.notes.map(n => `<li>${n}</li>`).join("")}</ul>`;

render();
</script>
